<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>NIKI COUTURE · 共鸣艺术刊</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #efeadb;
    color: #2e2a22;
    font-family: "MiSans", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    padding: 24px 12px 40px;
}
.serif { font-family: "Noto Serif SC", "Source Han Serif SC", "STSong", "SimSun", serif; }
.paper {
    max-width: 900px;
    margin: 0 auto;
    background: #f9f6ec;
    border: 1px solid #d9cfb4;
    box-shadow: 0 2px 18px rgba(80, 68, 40, 0.10);
    padding: 28px 26px 22px;
}
.mast {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    font-size: 10px;
    letter-spacing: 3px;
    color: #9a8c6a;
    font-weight: bold;
}
.brand {
    text-align: center;
    font-size: clamp(30px, 6vw, 46px);
    font-weight: bold;
    letter-spacing: 10px;
    margin-top: 12px;
    line-height: 1.15;
}
.tagline {
    text-align: center;
    font-size: 13px;
    letter-spacing: 6px;
    color: #ab8a55;
    margin-top: 8px;
}
.rule { border-top: 3px solid #2e2a22; margin-top: 16px; }
.rule-thin { border-top: 1px solid #2e2a22; margin-top: 2px; }

/* 策展人条 */
.curator {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #ece5d2;
    border: 1px solid #d9cfb4;
    border-radius: 10px;
    padding: 12px 16px;
    margin-top: 14px;
    flex-wrap: wrap;
}
.curator .avatar {
    width: 50px; height: 50px;
    border-radius: 50%;
    border: 2px solid #ab8a55;
    background: #e0d6ba;
    object-fit: cover;
    flex: 0 0 auto;
}
.curator .who { flex: 1 1 160px; min-width: 0; }
.who-tag { font-size: 10px; letter-spacing: 2px; color: #ab8a55; font-weight: bold; }
.who-name { font-size: 18px; font-weight: bold; margin-top: 2px; }
.who-meta { font-size: 11px; color: #9a8c6a; margin-top: 2px; }
.curator-stats { display: flex; text-align: center; flex-wrap: wrap; }
.cs-cell { padding: 2px 16px; border-left: 1px solid #d3c8aa; }
.cs-num { font-size: 21px; font-weight: bold; line-height: 25px; }
.cs-num small { font-size: 11px; color: #9a8c6a; font-weight: normal; }
.cs-label { font-size: 10px; color: #9a8c6a; margin-top: 3px; letter-spacing: 1px; }

/* 工具条 */
.toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin: 16px 0 4px;
}
.chip-btn {
    border: 1px solid #c9b68c;
    background: #fffdf4;
    color: #6d5f42;
    font-size: 12px;
    font-weight: bold;
    border-radius: 999px;
    padding: 5px 14px;
    cursor: pointer;
    letter-spacing: 1px;
}
.chip-btn.on { background: #2e2a22; border-color: #2e2a22; color: #f9f6ec; }
.toolbar .spacer { flex: 1; }
.share-btn {
    border: none;
    background: #b99a63;
    color: #fdf8ea;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 2px;
    border-radius: 999px;
    padding: 7px 18px;
    cursor: pointer;
}
.share-btn[disabled] { opacity: 0.6; cursor: wait; }

/* 池子区块 */
.pool { margin-top: 22px; }
.pool-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.pool-title { font-size: 20px; font-weight: bold; letter-spacing: 3px; }
.pool-sub { font-size: 11px; letter-spacing: 2px; color: #ab8a55; }
.pool-stats { font-size: 12px; color: #9a8c6a; }
.pool-stats b { color: #6d5f42; }
.cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 14px;
    margin-top: 12px;
}

/* 套装卡 */
.card {
    background: #fffdf4;
    border: 1px solid #e3dac2;
    border-radius: 12px;
    padding: 10px 8px 8px;
    text-align: center;
    cursor: pointer;
    transition: box-shadow 0.15s;
}
.card:hover { box-shadow: 0 3px 12px rgba(80, 68, 40, 0.14); }
.pic {
    width: 118px; height: 118px;
    max-width: 100%;
    border-radius: 50%;
    border: 2px solid #d5c8a2;
    object-fit: cover;
    display: block;
    margin: 0 auto;
    background: #efe8d5;
}
.pic-holder {
    width: 118px; height: 118px;
    border-radius: 50%;
    border: 2px solid #d5c8a2;
    background: #efe8d5;
    color: #b3a482;
    font-size: 11px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto;
}
.card.missing .pic, .card.missing .pic-holder { opacity: 0.35; }
.card-name { font-size: 14px; font-weight: bold; margin-top: 8px; line-height: 1.3; }
.card-src { font-size: 10px; color: #a5967f; margin-top: 2px; }
.card-meta {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 8px; padding: 7px 4px 0;
    border-top: 1px dotted #e0d6ba;
}
.card-draws { font-size: 14px; font-weight: bold; }
.card-draws small { font-size: 10px; color: #a5967f; font-weight: normal; }
.chip { font-size: 11px; font-weight: bold; border-radius: 999px; padding: 1px 9px; }
.chip.ok { background: #e3efdd; color: #4e8a5e; }
.chip.part { background: #efe9d8; color: #9a8c6a; }

/* 单件明细(点击展开) */
.detail { display: none; text-align: left; margin-top: 10px; border-top: 1px solid #e8e0c8; padding-top: 10px; }
.card.open .detail { display: block; }
.d-summary { font-size: 11px; color: #9a8c6a; margin-bottom: 8px; }
.d-summary b { color: #6d5f42; }
.cloths { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
.cloth { position: relative; }
.cloth img { width: 100%; border-radius: 8px; display: block; background: #efe8d5; }
.cloth .ph { width: 100%; aspect-ratio: 1; border-radius: 8px; background: #efe8d5; display: block; }
.cloth.missing img, .cloth.missing .ph { opacity: 0.22; }
.b {
    position: absolute;
    font-size: 11px; font-weight: bold;
    border-radius: 6px; padding: 0 5px;
    line-height: 17px;
}
.b.first { right: 2px; bottom: 2px; background: #e9c787; color: #4a3510; }
.b.second { left: 2px; bottom: 2px; background: #ff9ec7; color: #5c1e38; }
.b.zero { right: 2px; bottom: 2px; background: #d8cfb4; color: #8d8062; }

/* 落款 */
.foot-rule { border-top: 2px solid #2e2a22; margin-top: 24px; }
.foot {
    display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    margin-top: 10px;
    font-size: 10px; letter-spacing: 1px; color: #9a8c6a;
}
.foot .cert { font-size: 11px; letter-spacing: 3px; color: #ab8a55; font-weight: bold; }

/* 加载/过期/提示 */
#loading {
    text-align: center;
    padding: 80px 0;
    font-size: 14px;
    letter-spacing: 4px;
    color: #9a8c6a;
}
#expired {
    max-width: 420px; margin: 60px auto; text-align: center;
    background: #f9f6ec; border: 1px solid #d9cfb4; padding: 34px 30px;
}
#expired h1 { font-size: 20px; letter-spacing: 4px; margin-bottom: 10px; }
#expired p { font-size: 13px; color: #9a8c6a; line-height: 1.8; }
#toast {
    position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%);
    background: #2e2a22; color: #f9f6ec;
    font-size: 13px; border-radius: 999px; padding: 9px 22px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    z-index: 99;
}
@media (max-width: 560px) {
    .paper { padding: 20px 14px 16px; }
    .brand { letter-spacing: 6px; }
    .cs-cell { padding: 2px 10px; }
    .pic, .pic-holder { width: 104px; height: 104px; }
}
</style>
</head>
<body>
<div id="loading">正在加载抽取数据 …</div>
<div id="expired" hidden>
    <h1 class="serif">页面已过期</h1>
    <p>抽卡页面链接仅在 10 分钟内有效。</p>
    <p>请重新发送 <code>nk抽卡页面</code> 获取新链接。</p>
</div>

<div id="app" hidden>
    <div class="paper">
        <div class="mast">
            <span>HAUTE COUTURE ARCHIVE</span>
            <span id="mast-issue">VOL. 2026</span>
            <span>AUTHENTICATED</span>
        </div>
        <div class="brand serif">NIKI COUTURE</div>
        <div class="tagline serif">共鸣艺术刊 · 全池典藏名录</div>
        <div class="rule"></div>
        <div class="rule-thin"></div>

        <div class="curator" id="curator"></div>

        <div class="toolbar">
            <button class="chip-btn on" data-f="all">全部</button>
            <button class="chip-btn" data-f="5">五星</button>
            <button class="chip-btn" data-f="4">四星</button>
            <button class="chip-btn" data-f="owned">已齐套</button>
            <button class="chip-btn" data-f="missing">未齐套</button>
            <span class="spacer"></span>
            <button class="share-btn" id="share-btn">生成分享图片</button>
        </div>

        <div id="pools"></div>

        <div class="foot-rule"></div>
        <div class="foot">
            <div id="foot-left">ARCHIVAL REGISTRY CODE</div>
            <div class="cert serif">★ CERTIFICATE OF COUTURE ★</div>
        </div>
    </div>
</div>

<div id="toast" hidden></div>

<script>
(function () {
    'use strict';

    var state = { data: null, filter: 'all' };
    var app = document.getElementById('app');
    var loading = document.getElementById('loading');
    var expiredBox = document.getElementById('expired');

    function el(tag, cls, text) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text !== null && text !== undefined) n.textContent = text;
        return n;
    }

    var toastTimer = null;
    function toast(msg) {
        var t = document.getElementById('toast');
        t.textContent = msg;
        t.hidden = false;
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { t.hidden = true; }, 2600);
    }

    function showExpired() {
        loading.hidden = true;
        app.hidden = true;
        expiredBox.hidden = false;
    }

    function init() {
        // 页面 URL 是 /niki/gacha/{token}(无尾斜杠): 相对路径 ./data 会把
        // token 段替换掉, 必须基于 location.pathname 显式拼接
        var dataUrl = location.pathname.replace(/\/+$/, '') + '/data';
        fetch(dataUrl, { cache: 'no-store' }).then(function (r) {
            if (r.status === 404) throw new Error('expired');
            if (!r.ok) throw new Error('load');
            return r.json();
        }).then(function (d) {
            state.data = d;
            renderAll();
        }).catch(function (e) {
            if (e && e.message === 'expired') { showExpired(); return; }
            loading.hidden = false;
            loading.textContent = '数据加载失败, 请关闭后重新生成链接';
        });
    }

    function totalStats() {
        var s = { total: 0, owned: 0, totalDraws: 0, collected: 0 };
        (state.data.pools || []).forEach(function (p) {
            s.total += p.stats.total;
            s.owned += p.stats.owned;
            s.totalDraws += p.stats.totalDraws;
            s.collected += p.stats.collected;
        });
        s.avgDraws = s.collected ? Math.round(s.totalDraws / s.collected * 10) / 10 : 0;
        return s;
    }

    function renderAll() {
        loading.hidden = true;
        app.hidden = false;
        var d = state.data;
        var b = d.base || {};
        var t = totalStats();
        document.getElementById('mast-issue').textContent =
            'VOL. 2026 // ' + (d.generatedAt || '');

        var curator = document.getElementById('curator');
        curator.textContent = '';
        if (b.avatar) {
            var av = el('img', 'avatar');
            av.src = b.avatar; av.alt = '';
            curator.appendChild(av);
        } else {
            curator.appendChild(el('div', 'avatar'));
        }
        var who = el('div', 'who');
        who.appendChild(el('div', 'who-tag', 'CURATED BY · 典藏策展人'));
        who.appendChild(el('div', 'who-name', b.nickname || '未知'));
        who.appendChild(el('div', 'who-meta', 'UID: ' + (b.uid || '—') + ' · 等级 Lv.' + (b.level || 0)));
        curator.appendChild(who);

        var stats = el('div', 'curator-stats');
        [
            [String(t.totalDraws), '全池总抽数'],
            [t.owned + ' / ' + t.total, '齐套达成率'],
            [String(t.avgDraws), '单件均耗抽数']
        ].forEach(function (pair) {
            var cell = el('div', 'cs-cell');
            var num = el('div', 'cs-num');
            num.textContent = pair[0];
            cell.appendChild(num);
            cell.appendChild(el('div', 'cs-label', pair[1]));
            stats.appendChild(cell);
        });
        curator.appendChild(stats);

        document.getElementById('foot-left').textContent =
            'ARCHIVAL REGISTRY CODE: NK-' + (b.uid || '—') +
            ' · 生成于 ' + (d.generatedAt || '') + ' · 约 ' + (d.ttlMinutes || 10) + ' 分钟后过期';

        renderPools();
        wireToolbar();
    }

    function renderPools() {
        var host = document.getElementById('pools');
        host.textContent = '';
        (state.data.pools || []).forEach(function (p) {
            host.appendChild(poolSection(p));
        });
    }

    function poolSection(p) {
        var sec = el('section', 'pool');
        sec.dataset.pool = p.key;
        var head = el('div', 'pool-head');
        var titleBox = el('div');
        titleBox.appendChild(el('span', 'pool-title serif', p.label));
        titleBox.appendChild(el('span', 'pool-sub', ' · ' + p.subtitle));
        head.appendChild(titleBox);
        var st = p.stats || {};
        var statLine = el('div', 'pool-stats');
        statLine.appendChild(el('b', null, (st.owned || 0) + '/' + (st.total || 0)));
        statLine.appendChild(document.createTextNode(
            ' 套 · 总抽数 ' + (st.totalDraws || 0) +
            ' · 单件均耗 ' + (st.avgDraws || 0) +
            ' · 进化 ' + (st.evolutionCount || 0) + '/' + (st.evolutionTotal || 0)
        ));
        head.appendChild(statLine);
        sec.appendChild(head);

        var grid = el('div', 'cards');
        (p.suits || []).forEach(function (s) {
            grid.appendChild(suitCard(s));
        });
        sec.appendChild(grid);
        return sec;
    }

    function suitCard(s) {
        var touched = s.isCollected || s.touched;
        var card = el('article', 'card' + (touched ? '' : ' missing'));
        card.dataset.level = String(s.level || 5);
        card.dataset.owned = s.isCollected ? '1' : '0';

        if (s.preview) {
            var pic = el('img', 'pic');
            pic.src = s.preview; pic.alt = '';
            pic.loading = 'lazy';
            pic.onerror = function () {
                var ph = el('div', 'pic-holder', '无预览');
                pic.replaceWith(ph);
            };
            card.appendChild(pic);
        } else {
            card.appendChild(el('div', 'pic-holder', '无预览'));
        }

        card.appendChild(el('div', 'card-name', s.name || '未知套装'));
        card.appendChild(el('div', 'card-src', s.pool || ''));

        var meta = el('div', 'card-meta');
        var draws = el('span', 'card-draws');
        draws.appendChild(document.createTextNode(String(s.totalDrawNum || 0) + ' '));
        draws.appendChild(el('small', null, '抽'));
        meta.appendChild(draws);
        var complete = s.clothTotal > 0 && s.ownedClothCount >= s.clothTotal;
        meta.appendChild(el('span', 'chip ' + (complete ? 'ok' : 'part'),
            complete ? '齐套✓' : s.ownedClothCount + '/' + s.clothTotal + '件'));
        card.appendChild(meta);

        card.appendChild(detailBox(s));
        card.addEventListener('click', function () {
            card.classList.toggle('open');
        });
        return card;
    }

    function detailBox(s) {
        var d = el('div', 'detail');
        var sum = el('div', 'd-summary');
        sum.appendChild(el('b', null, '单件明细'));
        sum.appendChild(document.createTextNode(
            ' · 已共鸣 ' + s.ownedClothCount + '/' + s.clothTotal + ' 件' +
            ' · 单件均耗 ' + s.avgDrawNum + ' 抽' +
            ' · 进化 ' + s.evolutionCount + '/' + s.evolutionTotal
        ));
        d.appendChild(sum);

        var grid = el('div', 'cloths');
        (s.cloths || []).forEach(function (c) {
            var cell = el('div', 'cloth' + (c.owned ? '' : ' missing'));
            if (c.image) {
                var img = el('img');
                img.src = c.image; img.alt = c.displayType || '';
                img.loading = 'lazy';
                cell.appendChild(img);
            } else {
                cell.appendChild(el('span', 'ph'));
            }
            if (c.owned) {
                cell.appendChild(el('span', 'b first', String(c.drawNumFirst)));
                if (c.drawNumSecond > 0) {
                    cell.appendChild(el('span', 'b second', String(c.drawNumSecond)));
                }
            } else {
                cell.appendChild(el('span', 'b zero', '—'));
            }
            grid.appendChild(cell);
        });
        d.appendChild(grid);
        return d;
    }

    function wireToolbar() {
        var btns = document.querySelectorAll('.chip-btn');
        btns.forEach(function (btn) {
            btn.addEventListener('click', function () {
                btns.forEach(function (b) { b.classList.remove('on'); });
                btn.classList.add('on');
                state.filter = btn.dataset.f;
                applyFilter();
            });
        });
        document.getElementById('share-btn').addEventListener('click', shareImage);
    }

    function matchesFilter(card) {
        var f = state.filter;
        if (f === 'all') return true;
        if (f === '5') return card.dataset.level === '5';
        if (f === '4') return card.dataset.level === '4';
        if (f === 'owned') return card.dataset.owned === '1';
        if (f === 'missing') return card.dataset.owned === '0';
        return true;
    }

    function applyFilter() {
        document.querySelectorAll('#pools .pool').forEach(function (sec) {
            var visible = 0;
            sec.querySelectorAll('.card').forEach(function (card) {
                var show = matchesFilter(card);
                card.hidden = !show;
                if (show) visible += 1;
            });
            sec.hidden = visible === 0;
        });
    }

    // ----------------------------- 分享图片 -----------------------------

    var CDNS = [
        'https://lib.baomitu.com/html2canvas/1.4.1/html2canvas.min.js',
        'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
        'https://cdn.staticfile.org/html2canvas/1.4.1/html2canvas.min.js'
    ];

    function ensureLib() {
        if (window.html2canvas) return Promise.resolve();
        return new Promise(function (resolve, reject) {
            var i = 0;
            function next() {
                if (i >= CDNS.length) { reject(new Error('lib')); return; }
                var s = document.createElement('script');
                s.src = CDNS[i++];
                s.onload = function () {
                    if (window.html2canvas) resolve(); else next();
                };
                s.onerror = next;
                document.head.appendChild(s);
            }
            next();
        });
    }

    function waitImages(timeoutMs) {
        // 只等可见图: 收起的单件明细/被筛选隐藏的卡片(display:none)不会
        // 被截进图, 强制 eager 反而要白等上千张隐藏图下载
        var imgs = Array.prototype.slice.call(document.querySelectorAll('#app img'))
            .filter(function (img) { return img.offsetParent !== null; });
        imgs.forEach(function (img) { img.loading = 'eager'; });
        var deadline = Date.now() + timeoutMs;
        return Promise.all(imgs.map(function (img) {
            if (img.complete) return null;
            return new Promise(function (res) {
                var done = function () { img.onload = null; img.onerror = null; res(null); };
                img.onload = done;
                img.onerror = done;
                if (Date.now() > deadline) res(null);
                else setTimeout(done, Math.max(100, deadline - Date.now()));
            });
        }));
    }

    function saveBlob(blob, filename) {
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    }

    function shareImage() {
        var btn = document.getElementById('share-btn');
        btn.disabled = true;
        var b = (state.data.base || {});
        var filename = 'NIKI-COUTURE-' + (b.uid || 'share') + '.png';
        ensureLib().then(function () {
            toast('正在渲染分享图片...');
            return waitImages(15000);
        }).then(function () {
            return html2canvas(app, {
                scale: 2,
                backgroundColor: '#efeadb',
                useCORS: true,
                logging: false,
                imageTimeout: 10000
            });
        }).then(function (canvas) {
            return new Promise(function (resolve, reject) {
                canvas.toBlob(function (blob) {
                    if (blob) resolve(blob); else reject(new Error('blob'));
                }, 'image/png');
            });
        }).then(function (blob) {
            var file;
            try {
                file = [new File([blob], filename, { type: 'image/png' })];
            } catch (e) { file = null; }
            if (file && navigator.canShare && navigator.canShare({ files: file })) {
                return navigator.share({ files: file }).catch(function (e) {
                    if (e && e.name !== 'AbortError') saveBlob(blob, filename);
                });
            }
            saveBlob(blob, filename);
        }).then(function () {
            btn.disabled = false;
            toast('分享图片已生成');
        }).catch(function (e) {
            btn.disabled = false;
            toast(e && e.message === 'lib'
                ? '导出库加载失败, 请检查网络后重试'
                : '生成失败, 请稍后重试');
        });
    }

    init();
})();
</script>
</body>
</html>
